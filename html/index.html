<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Delivery Route</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>🚚 Smart Delivery Route</h1>
        <p>Find the shortest delivery route</p>
    </header>

    <main>

        <section class="route-section">

            <h2>Delivery Route Planner</h2>

            <div class="form-container">

                <div class="input-group">
                    <label for="fromLocation">From</label>

                    <select id="fromLocation">
                        <option value="">Select starting location</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="toLocation">To</label>

                    <select id="toLocation">
                        <option value="">Select destination</option>
                    </select>
                </div>

                <button id="findRouteBtn">
                    Find Best Route
                </button>

            </div>

        </section>


        <section id="resultSection" class="result-section">

            <h2>Best Delivery Route</h2>

            <div id="routeContainer">
                <p class="empty-message">
                    Select locations and find the best route.
                </p>
            </div>

            <div class="route-summary">

                <div class="summary-card">
                    <h3>Total Distance</h3>
                    <p id="distance">-</p>
                </div>

                <div class="summary-card">
                    <h3>Number of Stops</h3>
                    <p id="stops">-</p>
                </div>

                <div class="summary-card">
                    <h3>Estimated Time</h3>
                    <p id="time">-</p>
                </div>

            </div>

        </section>

    </main>


    <script src="../data/data.js"></script>
    <script src="../js/feature/delivery.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
