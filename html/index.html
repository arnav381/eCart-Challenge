<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Recommendations</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <h1>Product Explorer</h1>
        <p>Personalized Recommendations</p>
    </header>

    <main>

        <section class="user-section">
            <h2>Current User</h2>

            <select id="userSelect">
                <option value="0">User A</option>
                <option value="1">User B</option>
                <option value="2">User C</option>
            </select>
        </section>

        <section class="viewed-section">
            <h2>Currently Viewed Products</h2>
            <div id="viewedProducts"></div>
        </section>

        <section class="recommendation-section">

            <div class="section-header">
                <h2>Recommended For You</h2>

                <button id="refreshBtn">
                    Refresh Recommendations
                </button>
            </div>

            <div id="recommendations" class="product-grid"></div>

        </section>

    </main>

    <script src="../data/data.js"></script>
    <script src="../js/feature/recommendations.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
